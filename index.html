    <script>
        // 1. Инициализация 3D
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        // Камера (смотрим прямо на станок)
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 2, 15);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        renderer.outputEncoding = THREE.sRGBEncoding; 
        container.appendChild(renderer.domElement);

        // Свет (сделаем его более холодным и контрастным)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        
        const spotLight = new THREE.SpotLight(0xffffff, 3);
        spotLight.position.set(10, 20, 10);
        scene.add(spotLight);
        
        const pointLight = new THREE.PointLight(0xFF4D00, 5); // Оранжевый
        pointLight.position.set(-10, 5, 10);
        scene.add(pointLight);

        // Загрузка модели
        const loader = new THREE.GLTFLoader();
        let model;

        loader.load('cnc-machine.glb', function (gltf) {
            model = gltf.scene;
            
            // Центрируем модель ровно по центру экрана
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            model.position.x += (model.position.x - center.x);
            model.position.y += (model.position.y - center.y);
            model.position.z += (model.position.z - center.z);

            // Немного поворачиваем станок, чтобы он стоял в 3/4 оборота (так красивее)
            model.rotation.y = Math.PI / 4; 

            scene.add(model);
        }, undefined, function (error) {
            console.error('Ошибка загрузки 3D:', error);
        });

        // Отслеживание мыши (только для легкого наклона)
        let mouseX = 0;
        let mouseY = 0;

        document.addEventListener('mousemove', (e) => {
            // Получаем координаты от -1 до 1
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        // Анимация
        function animate() {
            requestAnimationFrame(animate);
            
            if (model) {
                // Плавно наклоняем станок за мышкой
                // По X (влево-вправо) - поворачиваем камеру (наклоняем модель)
                model.rotation.z += (-mouseX * 0.2 - model.rotation.z) * 0.05;
                
                // По Y (вверх-вниз) - немного наклоняем вперед/назад
                model.rotation.x += (mouseY * 0.1 - model.rotation.x) * 0.05;
            }
            
            renderer.render(scene, camera);
        }
        animate();

        // Ресайз
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // --- ОСТАЛЬНЫЕ СКРИПТЫ (Форма, Анимации появления, Скролл) ---
        
        // (Оставь код формы, анимации появления reveal и плавного скролла как было)
    </script>
